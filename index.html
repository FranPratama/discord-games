<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Detectable Games List</title>
    <!-- Favicon -->
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4053/4053305.png" type="image/png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-white dark:bg-[#36393f] text-[#1f2937] dark:text-[#dcddde] min-h-screen flex flex-col transition-colors duration-300 relative font-sans">

    <!-- COOL BACK TO TOP BUTTON -->
    <button id="backToTopBtn" aria-label="Back to top"
        class="fixed bottom-8 right-8 z-50 w-14 h-14 rounded-full bg-gradient-to-br from-[#5865F2] to-[#4752C4] text-white shadow-lg shadow-indigo-500/30 flex items-center justify-center transform translate-y-20 opacity-0 transition-all duration-500 ease-out hover:scale-110 hover:-translate-y-1 hover:shadow-indigo-500/50 group">
        <i class="fas fa-arrow-up text-xl group-hover:animate-bounce"></i>
    </button>

    <!-- Header -->
    <header class="bg-white/80 dark:bg-[#202225]/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50 transition-all duration-300 shadow-sm flex flex-col">
        <div class="container mx-auto px-4 py-3 flex flex-col lg:flex-row justify-between items-center gap-4 max-w-6xl">
            
            <div class="flex flex-col sm:flex-row items-center gap-4 sm:gap-6 w-full lg:w-auto">
                <div class="flex items-center gap-3 shrink-0">
                    <i class="fa-brands fa-discord text-2xl text-[#5865F2]"></i>
                    <h1 class="text-lg font-bold tracking-tight">Detectable Games</h1>
                </div>

                <!-- Minimalist Data Controls -->
                <div class="flex items-center bg-gray-50 dark:bg-[#2f3136] rounded-lg border border-gray-200 dark:border-gray-700 shadow-inner w-full sm:w-auto">
                    <div class="relative">
                        <select id="apiVersionSelect" aria-label="Select Discord API Version"
                            class="bg-transparent text-xs font-medium text-gray-600 dark:text-gray-300 focus:outline-none cursor-pointer appearance-none py-1.5 pl-3 pr-6 w-full sm:w-32">
                            <option value="10">v10 (Available)</option>
                            <option value="9">v9 (Available)</option>
                            <option value="8">v8 (Deprecated)</option>
                            <option value="7">v7 (Deprecated)</option>
                            <option value="6" selected>v6 (Default)</option>
                            <option value="5">v5 (Discontinued)</option>
                            <option value="4">v4 (Discontinued)</option>
                            <option value="3">v3 (Discontinued)</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                            <i class="fas fa-chevron-down text-[0.65rem]"></i>
                        </div>
                    </div>
                    
                    <div class="w-px h-5 bg-gray-200 dark:bg-gray-700"></div>
                    
                    <button id="fetchApiBtn" title="Auto-fetching enabled" disabled class="text-xs font-bold text-gray-400 dark:text-gray-600 cursor-not-allowed px-3 py-1.5 flex items-center gap-1.5 rounded-r-lg transition-colors">
                        <i id="syncIcon" class="fas fa-sync-alt"></i> <span class="hidden sm:inline">Fetch</span>
                    </button>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2 sm:gap-3 w-full lg:w-auto justify-end">
                <!-- Search Bar -->
                <div class="relative flex-grow lg:w-48 group">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 group-focus-within:text-[#5865F2] transition-colors">
                        <i class="fas fa-search text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search games..." aria-label="Search detectable games" 
                        class="border border-[#e5e7eb] dark:border-[#2f3136] dark:bg-[#2f3136] dark:text-[#dcddde] focus:outline-none focus:border-transparent focus:ring-2 focus:ring-[#5865F2]/20 w-full py-1.5 pl-8 pr-3 rounded-lg text-xs shadow-sm transition-all duration-300">
                </div>

                <!-- Theme Filter Dropdown -->
                <div class="relative w-28">
                    <select id="themeSelect" aria-label="Filter games by theme" 
                        class="border border-[#e5e7eb] dark:border-[#2f3136] dark:bg-[#2f3136] dark:text-[#dcddde] focus:outline-none focus:border-transparent focus:ring-2 focus:ring-[#5865F2]/20 w-full appearance-none py-1.5 pl-3 pr-6 rounded-lg text-xs shadow-sm bg-transparent cursor-pointer truncate transition-colors duration-200">
                        <option value="">All Themes</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                        <i class="fas fa-chevron-down text-[0.65rem]"></i>
                    </div>
                </div>

                <!-- Sort Dropdown -->
                <div class="relative w-24">
                    <select id="sortSelect" aria-label="Sort games by name" 
                        class="border border-[#e5e7eb] dark:border-[#2f3136] dark:bg-[#2f3136] dark:text-[#dcddde] focus:outline-none focus:border-transparent focus:ring-2 focus:ring-[#5865F2]/20 w-full appearance-none py-1.5 pl-3 pr-6 rounded-lg text-xs shadow-sm bg-transparent cursor-pointer transition-colors duration-200">
                        <option value="">Sort by</option>
                        <option value="asc">A-Z</option>
                        <option value="desc">Z-A</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                        <i class="fas fa-chevron-down text-[0.65rem]"></i>
                    </div>
                </div>

                <!-- Theme Toggle -->
                <button id="themeToggleBtn" aria-label="Toggle Dark Mode" class="p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-500 dark:text-gray-400" title="Toggle Theme">
                    <i id="themeIcon" class="fas fa-moon text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-6 flex-grow max-w-5xl">

        <!-- SUCCESS/ERROR MESSAGES -->
        <div id="successBanner" class="hidden mb-6 bg-green-50 dark:bg-green-900/20 border-l-4 border-green-500 text-green-700 dark:text-green-400 px-4 py-3 shadow-sm text-sm" role="alert">
            <div class="flex items-center">
                <i class="fas fa-check mr-2"></i>
                <span class="font-medium" id="statusText">Data loaded successfully.</span>
            </div>
        </div>
        <div id="errorMsg" class="hidden mb-6 p-4 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 rounded-r-lg text-red-700 dark:text-red-400 text-sm shadow-sm"></div>

        <!-- LIST CONTAINER -->
        <div class="mb-2 flex justify-between items-end px-2">
            <h2 class="text-sm font-bold uppercase text-gray-500 dark:text-gray-400 tracking-wider">Game Library</h2>
            <span id="countBadge" class="text-xs font-mono text-gray-400">0 items</span>
        </div>

        <div id="appList" class="flex flex-col pt-2">
            <!-- Items injected here -->
            <div class="flex flex-col items-center justify-center py-24 text-gray-400 animate-pulse">
                <span class="animate-spin rounded-full border-[3px] border-[#e5e7eb] dark:border-[#4b5563] border-t-[#5865F2] dark:border-t-[#5865F2] inline-block mb-4 w-10 h-10"></span>
                <span class="text-sm font-medium tracking-wide">Loading database...</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-xs text-gray-400 dark:text-gray-600 mt-8">
        <p>Client-side Viewer</p>
    </footer>

    <!-- Logic Script -->
    <script src="script.js"></script>
</body>
</html>
